services:
  # Base de datos MongoDB
  mongo:
    image: mongo:7
    container_name: beacon_mongo
    environment:
      MONGO_INITDB_DATABASE: beassistant
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - app_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ping:1}).ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend FastAPI
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: beacon_backend
    environment:
      MONGODB_URL: mongodb://mongo:27017
      MONGODB_DB: beassistant
    ports:
      - "8000:8000"
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - app_network
    restart: unless-stopped
    volumes:
      - ./backend:/app
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

# Volúmenes persistentes
volumes:
  mongo_data:
    name: beacon_mongo_data

# Red para comunicación entre contenedores
networks:
  app_network:
    driver: bridge
